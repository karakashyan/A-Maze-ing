[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "0.1.0"
description = "Reusable maze generator for the A-Maze-ing 42 project"
readme = "mazegen/README.md"
requires-python = ">=3.10"
authors = [
    { name = "ekarakas" },
    { name = "arptadev" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mazegen*"]